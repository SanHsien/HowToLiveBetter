name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-gate:
    name: Windows 11 Gate
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Python dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Windows Dev Check
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh -NoProfile -File tools/dev_check.ps1

  cross-platform-check:
    name: Linux Compatibility Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Python dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify Content Quality
        run: |
          node tools/check-zh-tw-locale.mjs
          node tools/check-refs.mjs --check
          node tools/check-plain.mjs
          node tools/check-selfcheck.mjs

      - name: Verify Python Suite
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m pytest -q
          python tools/check_links.py
