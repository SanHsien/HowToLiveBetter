# Tool configuration only. This repository is not a Python package:
# no [project] / [build-system] on purpose.

[tool.pytest.ini_options]
testpaths = ["tools"]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
